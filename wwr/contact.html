<!DOCTYPE html>

<html lang="en-US">

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Contact Us - Rafting Travel</title>
    <link rel='stylesheet' href='styles/rafting.css'>
    <meta name="description"
      content="Check out our prices for a complete white water rafting experience. Contact us for any questions.">
    <meta name="author" content="Kent Olson">
</head>

<body>
    <header class="grid">
        <img src="images/logo.jpg" alt="Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="info">
            <h1>Rafting Travel</h1>
            <p>N Usery Pass Rd</p>
            <p>Mesa, AZ 85215</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="grid" id="get-in-touch">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d21557.151527691007!2d-111.63251311076615!3d33.5563362594603!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x872bbc5f15b7fdb9%3A0x502957b1ea1958ff!2sGoldfield%20Recreation%20Area!5e1!3m2!1sen!2sus!4v1791670073179!5m2!1sen!2sus"
              allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="fullname" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@email.com" required>
                <p>Message Purpose</p>
                <div>
                    <label><input type="radio" name="purpose" value="General" id="general"> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="Reservation" id="reservation">
                        Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="Website" id="website"> Website
                        Suggestion</label>
                </div>
                <label for="message" class="full-row">Message</label>
                <textarea name="message" id="message" placeholder="Text here" rows="6"
                  class="full-row"></textarea>
                <label class="full-row"><input type="checkbox" id="subscribe" name="subscribe">
                    Please Subscribe me
                    to
                    the
                    monthly newsletter</label>
                <button type="submit" class="full-row">Get in Touch!</button>
            </form>
        </div>
        <div id="employees">
            <section class="grid">
                <h2 class="full-row">We Are Here to Serve You</h2>
                <figure>
                    <img src="images/employee-1.webp" alt="Bob Johns">
                    <figcaption>Bob Johns - Equipment Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-2.webp" alt="Frank Moses">
                    <figcaption>Frank Moses - River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-3.webp" alt="Brick Stone">
                    <figcaption>Brick Stone - Medic</figcaption>
                </figure>
            </section>
        </div>
    </main>

    <footer>
        <p>©2026 Rafting Travel | Kent Olson</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.webp"
                  alt="Facebook Logo Link"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.webp"
                  alt="Instagram Logo Link"></a>
            <a href="https://www.youtube.com/"><img src="images/youtube.webp"
                  alt="Youtube Logo Link"></a>
        </nav>
    </footer>
</body>

</html>
