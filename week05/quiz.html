<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Code-along Activity: Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML/CSS Quiz</h1>
    </header>
    <main>
        <form>
            <div>
                <h2>1.</h2>
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="q1">
            </div>
            <div>
                <h2>2.</h2>
                <label for="q2">How does HTML and CSS work together?</label>
                <textarea name="q2" id="q2" placeholder='Write here...' rows="4"></textarea>
            </div>
            <div>
                <h2>3.</h2>
                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select name=" q3" id="q3">
                    <option>Choose One...</option>
                    <option># This is a comment</option>
                    <option>This is a comment</option>
                    <option>/* This is a comment*/</option>
                </select>
            </div>
            <div>
                <h2>4.</h2>
                <label for="q4">What is the bottom margin give in this declaration?</label>
                <p>margin: 10px 5px 15px;</p>
                <input type="number" name="q4" id="q4">
            </div>
            <button>Submit</button>
        </form>
    </main>
</body>

</html>
